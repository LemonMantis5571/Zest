[package]
name = "zest-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop front-end for the Zest coding harness."

[lints]
workspace = true

[[bin]]
name = "zest-desktop"
path = "src/main.rs"

[lib]
name = "zest_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
zest-core = { path = "../core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
dirs = { workspace = true }
tokio = { workspace = true }
ts-rs = { version = "11", default-features = true, optional = true }
pdf-inspector = "0.1"
rfd = "0.15"
base64 = "0.22"

[features]
default = []
# Enable with `cargo test -p zest-desktop --features export-bindings` to regenerate TS DTOs.
export-bindings = ["dep:ts-rs"]
