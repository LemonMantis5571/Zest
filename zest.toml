# Zest configuration.
#
# Safe to commit: keys are never written here, only the name of the environment
# variable that holds them.
#
# First live path (accepted tradeoff): Codex subscription via CLIProxyAPI, the
# same bootstrap Tibo recommended for pointing a Messages-API client at GPT.
# See memory/decisions.md. Native Codex client later; the router does not care.

[providers.codex]
kind = "gateway"
base_url = "http://127.0.0.1:8317"   # origin only, no /v1/messages
api_key_env = "ZEST_GATEWAY_KEY"     # must match CLIProxyAPI's api-keys entry
model = "gpt-5.6-sol"
# Optional allow-lists. For provider `codex`, omitting `models` uses the built-in
# Sol/Terra/Luna (+ 5.5/5.4) catalogue. Other gateways accept only `model`.
# When `efforts` is omitted, the standard set (low…max) is used.
# models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]
# efforts = ["low", "medium", "high", "xhigh", "max"]

# Native Anthropic — optional second provider once ANTHROPIC_API_KEY is set.
# Leave commented until then so a missing key does not warn on every launch.
#
# [providers.anthropic]
# kind = "anthropic"
# api_key_env = "ANTHROPIC_API_KEY"

[routing]
# Where a task goes when no rule matches. Required once two or more providers
# are configured — guessing which account to spend would be the wrong kind of
# helpful.
default = { provider = "codex", model = "gpt-5.6-sol" }

# Rules are consulted in order, first match wins, matched against the `kind` a
# delegate call declares. Wired up in the next step.
#
# [[routing.rules]]
# kind = "mechanical"
# provider = "codex"
# model = "gpt-5.6-sol"
