# Zest configuration.
#
# Safe to commit: keys are never written here, only the name of the environment
# variable that holds them.
#
# With no zest.toml at all, Zest falls back to a single Anthropic provider read
# from ANTHROPIC_API_KEY — this file only becomes necessary once there is more
# than one provider to choose between.

[providers.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

# A gateway is anything that re-exposes another backend as the Messages API
# (CLIProxyAPI, a claude-bridge style proxy, LiteLLM). Reaching a provider this
# way is an implementation detail — routing cannot tell it from a native one, so
# it can be swapped for a native client later without anything above changing.
#
# Uncomment once a gateway is actually running, or `zest` will warn that this
# provider is unavailable and carry on with the others.
#
# [providers.codex]
# kind = "gateway"
# base_url = "http://127.0.0.1:8317"   # origin only, no /v1/messages
# api_key_env = "ZEST_GATEWAY_KEY"
# model = "gpt-5.3-codex"              # confirm the exact id your gateway expects

[routing]
# Where a task goes when no rule matches. Required once two or more providers
# are configured — guessing which account to spend would be the wrong kind of
# helpful.
default = { provider = "anthropic", model = "claude-opus-5" }

# Rules are consulted in order, first match wins, matched against the `kind` a
# delegate call declares. Wired up in the next step.
#
# [[routing.rules]]
# kind = "mechanical"
# provider = "codex"
# model = "gpt-5.3-codex"
